[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_USE_NETLIFY_EDGE = "true"
  SECRETS_SCAN_ENABLED = "false"

# 本番環境のみリダイレクトルール適用（プレビューデプロイには適用しない）
[context.production]

# Netlifyデフォルトドメインから3dlab.jpへリダイレクト
[[context.production.redirects]]
  from = "/*"
  to = "https://3dlab.jp/:splat"
  status = 301
  force = true
  conditions = {Host = ["3dworkshop.netlify.app"]}

# wwwから非wwwへリダイレクト
[[context.production.redirects]]
  from = "/*"
  to = "https://3dlab.jp/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.3dlab.jp"]}
# ===== 静的アセットのキャッシュ =====
# public/ 配下は Netlify CDN が直接配信するため next.config の headers() は効かない。
# Netlify の for パターンは拡張子グロブ非対応のため、実在アセットを明示する。
# （更新頻度が低い画像のみ7日キャッシュ。差し替え時は7日以内に自然反映）

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/hero-bg.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
