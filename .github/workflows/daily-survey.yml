name: 毎日のアンケートを公開して通知する

# Netlify にスケジューラが無いので、GitHub Actions から本番の API を叩く。
# 既存の update-sitemap.yml と同じ形。
#
# ⚠ schedule は数分〜十数分遅れて発火することがある。ずれても実害が出ないように、
#   API 側は何度呼ばれても同じ結果になるよう作ってある
#   （push_notification_log の dedupe_key と、条件付き UPDATE）。
on:
  schedule:
    # UTC 03:00 = JST 12:00
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 日次処理を実行
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET が未設定です（Settings > Secrets and variables > Actions）"
            exit 1
          fi

          # ⚠ -f を付けない。4xx/5xx でも本文を読みたい（何が起きたかがそこに書いてある）。
          #   代わりに末尾のステータス行で判定する
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            https://3dlab.jp/api/cron/daily-survey \
            -H "x-cron-secret: $CRON_SECRET")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::日次処理が失敗しました (HTTP $status)"
            exit 1
          fi

          # ストック切れは失敗ではないが、放置すると配信が止まるので目立たせる
          if echo "$body" | grep -q '"reason":"no_stock"'; then
            echo "::warning::設問のストックが尽きています。scripts/survey-generator.sh を実行してください"
          fi
