name: Claude

# PR や issue のコメントで @claude と呼ぶと、Claude がその場で答える・直す。
# 例: レビューの指摘に対して「@claude 1番の指摘を直して」と書くと、PR のブランチに修正を push する。
#
# 準備は claude-pr-review.yml と同じ（GitHub App のインストールと CLAUDE_CODE_OAUTH_TOKEN）。
# ⚠ contents: write を持つので、呼べるのはこのリポジトリに書き込める人だけ（action 側の既定）。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ファイルの編集・コミット・コメントは action が標準で持つ。型チェックと lint を回せるようにだけ足す
          claude_args: |
            --allowedTools "Bash(npm ci),Bash(npx tsc:*),Bash(npm run lint)"
