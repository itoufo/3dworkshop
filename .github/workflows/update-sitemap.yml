name: Update Sitemap

on:
  # 毎日0時（UTC）= 日本時間9時に実行
  schedule:
    - cron: '0 0 * * *'

  # 手動実行も可能
  workflow_dispatch:

  # 新しいワークショップやブログ記事が追加されたときも実行
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-sitemap.ts'

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: npm run generate:sitemap
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://3dlab.jp

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code public/sitemap.xml || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push sitemap
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          git commit -m "chore: サイトマップ自動更新 [skip ci]"
          git push

      - name: Deploy note
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "✅ Sitemap updated and pushed to main branch"
          echo "🚀 The host connected to main will deploy the change automatically"

      - name: No changes
        if: steps.git-check.outputs.changed != 'true'
        run: echo "ℹ️ No changes to sitemap - skipping commit"
